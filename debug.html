<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSearch Debug Console</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            margin: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #569cd6;
            border-bottom: 2px solid #569cd6;
            padding-bottom: 10px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #252526;
            border-radius: 5px;
            border-left: 4px solid #007acc;
        }
        .section h2 {
            color: #4ec9b0;
            margin-top: 0;
        }
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status.ok { background: #4caf50; color: white; }
        .status.error { background: #f44336; color: white; }
        .status.warning { background: #ff9800; color: white; }
        .log-output {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            font-size: 12px;
            white-space: pre-wrap;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #005a9e;
        }
        .test-input {
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 3px;
            margin: 5px;
            width: 200px;
        }
        .shortcuts-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .shortcut-item {
            background: #2d2d30;
            padding: 10px;
            border-radius: 3px;
            border: 1px solid #3c3c3c;
        }
        .shortcut-enabled {
            color: #4caf50;
        }
        .shortcut-disabled {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 OmniSearch Debug Console</h1>
        
        <div class="section">
            <h2>Extension Status</h2>
            <div id="extension-status">
                <div>Background Script: <span id="bg-status" class="status">Checking...</span></div>
                <div>Storage Access: <span id="storage-status" class="status">Checking...</span></div>
                <div>Omnibox Registration: <span id="omnibox-status" class="status">Checking...</span></div>
            </div>
        </div>

        <div class="section">
            <h2>Shortcuts Status</h2>
            <div>Total Shortcuts: <span id="shortcuts-count">0</span></div>
            <div>Enabled Shortcuts: <span id="enabled-count">0</span></div>
            <button onclick="refreshShortcuts()">Refresh Shortcuts</button>
            <div class="shortcuts-list" id="shortcuts-list"></div>
        </div>

        <div class="section">
            <h2>Test Omnibox</h2>
            <div>
                <input type="text" id="test-keyword" class="test-input" placeholder="Keyword (e.g., youtube)" value="youtube">
                <input type="text" id="test-query" class="test-input" placeholder="Search query (e.g., cats)" value="cats">
                <button onclick="testSearch()">Test Search</button>
            </div>
            <div id="test-result"></div>
        </div>

        <div class="section">
            <h2>Debug Actions</h2>
            <button onclick="clearStorage()">Clear All Storage</button>
            <button onclick="resetToDefaults()">Reset to Defaults</button>
            <button onclick="exportSettings()">Export Settings</button>
            <button onclick="reloadExtension()">Reload Extension</button>
        </div>

        <div class="section">
            <h2>Console Logs</h2>
            <button onclick="clearLogs()">Clear Logs</button>
            <button onclick="toggleAutoRefresh()">Toggle Auto-refresh</button>
            <div class="log-output" id="console-logs">Logs will appear here...</div>
        </div>
    </div>

    <script src="debug.js"></script>
</body>
</html>
