<!DOCTYPE html>
<html>
<head>
    <title>Create OmniSearch Icons</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        canvas { border: 1px solid #ccc; margin: 10px; }
        .icon-set { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>OmniSearch Icon Generator</h1>
    <p>This page generates placeholder icons for the OmniSearch extension. Right-click each canvas and "Save image as" to save the icons.</p>
    
    <div class="icon-set">
        <h3>16x16 Icon (icon16.png)</h3>
        <canvas id="icon16" width="16" height="16"></canvas>
    </div>
    
    <div class="icon-set">
        <h3>32x32 Icon (icon48.png)</h3>
        <canvas id="icon48" width="32" height="32"></canvas>
    </div>
    
    <div class="icon-set">
        <h3>48x48 Icon (icon48.png)</h3>
        <canvas id="icon48" width="48" height="48"></canvas>
    </div>
    
    <div class="icon-set">
        <h3>128x128 Icon (icon128.png)</h3>
        <canvas id="icon128" width="128" height="128"></canvas>
    </div>

    <script>
        function createIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            
            // Fill background
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Add "OS" text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${Math.floor(size * 0.4)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('OS', size / 2, size / 2);
            
            // Add search icon (magnifying glass)
            if (size >= 32) {
                ctx.strokeStyle = 'white';
                ctx.lineWidth = Math.max(1, size / 16);
                
                const centerX = size * 0.75;
                const centerY = size * 0.25;
                const radius = size * 0.08;
                
                // Circle
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.stroke();
                
                // Handle
                ctx.beginPath();
                ctx.moveTo(centerX + radius * 0.7, centerY + radius * 0.7);
                ctx.lineTo(centerX + radius * 1.4, centerY + radius * 1.4);
                ctx.stroke();
            }
        }
        
        // Generate all icons
        createIcon('icon16', 16);
        createIcon('icon48', 32);
        createIcon('icon48', 48);
        createIcon('icon128', 128);
        
        // Auto-download function (optional)
        function downloadIcon(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Add download buttons
        document.body.innerHTML += `
            <div style="margin-top: 30px;">
                <h3>Quick Download</h3>
                <button onclick="downloadIcon('icon16', 'icon16.png')">Download 16x16</button>
                <button onclick="downloadIcon('icon48', 'icon48.png')">Download 32x32</button>
                <button onclick="downloadIcon('icon48', 'icon48.png')">Download 48x48</button>
                <button onclick="downloadIcon('icon128', 'icon128.png')">Download 128x128</button>
            </div>
        `;
    </script>
</body>
</html>
